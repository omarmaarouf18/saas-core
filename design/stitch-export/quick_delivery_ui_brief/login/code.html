<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<header class="flex justify-between items-center px-margin-mobile py-4 w-full max-w-md mx-auto">
<div class="flex items-center gap-2">
<img alt="Quick Delivery Logo" class="w-10 h-10 rounded-lg shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCUYxRA54E6cjcYlvRVFKb_px_s2y93S8566ONfScVXsgPYSSBE6gSdLTQArSFMfjr2mhG7alWKuev5Yy0NhzYpR9ZQ2rA3j8kpPr7IXmQajXQZ3aA0q-orw1UwKUn_AfSCkScVcZrLA68fcVoLnnl70udecxTVux2o7yX72AdzmzffZeh60l8rewzNHY-4dRPHSbf45gMZhfgjHr1Wl7ro7aoKToJTdTPJIInLWTg6XnnRsQqDMvRpww">
<span class="font-headline-sm text-headline-sm text-primary tracking-tight">QD</span>
</div>
<div class="flex items-center gap-4">
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors" id="langToggle">AR</button>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center" id="themeToggle">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">light_mode</span>
</button>
</div>
</header>
<main class="flex-grow flex flex-col justify-center px-margin-mobile w-full max-w-md mx-auto relative z-10 pb-20">
<div class="mb-stack-lg text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to manage your deliveries efficiently.</p>
</div>
<form class="space-y-stack-md bg-surface p-6 rounded-xl shadow-[0_2px_8px_0_rgba(13,19,33,0.04)] border border-surface-container-high">
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border-1.5 border-outline-variant focus:border-primary focus:ring-0 font-body-md text-body-md text-on-surface bg-surface-lowest placeholder-outline-variant transition-colors" id="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-lg text-label-lg text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary underline-offset-2 hover:underline transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">lock</span>
<input class="w-full pl-10 pr-12 py-3 rounded-lg border-1.5 border-outline-variant focus:border-primary focus:ring-0 font-body-md text-body-md text-on-surface bg-surface-lowest placeholder-outline-variant transition-colors" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-[#FFC107] text-[#0D1321] font-label-lg text-label-lg py-3 rounded-lg mt-stack-md hover:bg-secondary-fixed-dim transition-colors active:scale-95 shadow-sm font-semibold" type="submit">
            Login
        </button>
</form>
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="text-primary font-semibold hover:underline underline-offset-2 transition-all" href="#">Sign Up</a>
</p>
</div>
</main>
<script>
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const passwordIcon = document.getElementById('passwordIcon');

    togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        passwordIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
    });

    const langToggleBtn = document.getElementById('langToggle');
    const htmlTag = document.documentElement;
    
    langToggleBtn.addEventListener('click', () => {
        if (htmlTag.getAttribute('dir') === 'ltr') {
            htmlTag.setAttribute('dir', 'rtl');
            langToggleBtn.textContent = 'EN';
        } else {
            htmlTag.setAttribute('dir', 'ltr');
            langToggleBtn.textContent = 'AR';
        }
    });
</script>
