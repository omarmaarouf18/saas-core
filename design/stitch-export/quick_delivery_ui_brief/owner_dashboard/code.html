<body class="text-on-background min-h-screen pb-24 pt-20">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/70 dark:bg-surface-container/70 backdrop-blur-md shadow-sm dark:shadow-none">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-2">
<div class="text-headline-md font-headline-md font-black bg-primary-container text-on-primary-container px-2 py-1 rounded-lg">QD</div>
</div>
<button class="relative p-2 text-primary dark:text-primary-fixed hover:bg-surface-variant/50 rounded-full transition-colors group">
<span class="material-symbols-outlined" data-icon="notifications" style="font-variation-settings: 'FILL' 1;">notifications</span>
<span class="absolute top-2 right-2 w-2.5 h-2.5 bg-secondary-fixed-dim rounded-full border border-surface"></span>
</button>
</div>
</header>
<main class="max-w-7xl mx-auto px-margin-mobile flex flex-col gap-stack-lg">
<!-- Welcome Section -->
<section class="mt-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Welcome back, Sarah</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-1">Here is your daily operational overview.</p>
</section>
<!-- KYC Banner -->
<div class="bg-[#FEF3C7] border border-[#F59E0B] rounded-lg p-4 flex items-start gap-3 shadow-[0_2px_8px_rgba(13,19,33,0.04)] relative">
<span class="material-symbols-outlined text-[#B45309] mt-0.5" data-icon="warning">warning</span>
<div class="flex-1">
<h3 class="font-title-lg text-title-lg text-[#92400E]">KYC Verification Pending</h3>
<p class="font-body-md text-body-md text-[#B45309] mt-1">Complete your profile to unlock full features.</p>
</div>
<button aria-label="Dismiss" class="text-[#B45309] hover:bg-[#FDE68A] p-1 rounded-full transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</button>
</div>
<!-- Metrics Hero Card (Bento Style) -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-unit">
<!-- Wallet Balance -->
<div class="col-span-1 md:col-span-2 bg-surface-container-lowest rounded-xl p-6 shadow-[0_2px_8px_rgba(13,19,33,0.04)] border border-surface-container-high relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary-fixed-dim/10 rounded-bl-full -mr-8 -mt-8"></div>
<div class="flex flex-col h-full justify-between relative z-10">
<div>
<p class="font-label-lg text-label-lg text-on-surface-variant mb-1 uppercase tracking-wider">Wallet Balance</p>
<h2 class="font-display-lg text-display-lg text-primary">$42,500.00</h2>
</div>
<div class="flex items-center gap-2 mt-6">
<span class="material-symbols-outlined text-secondary-fixed-dim bg-secondary-fixed/20 p-1.5 rounded-full" data-icon="trending_up">trending_up</span>
<span class="font-body-md text-body-md text-on-surface-variant">+12% this week</span>
</div>
</div>
</div>
<!-- Vertical Split metrics -->
<div class="grid grid-rows-2 gap-unit">
<!-- Subscription -->
<div class="bg-primary-container text-on-primary rounded-xl p-5 shadow-[0_2px_8px_rgba(13,19,33,0.04)] flex flex-col justify-center">
<p class="font-label-sm text-label-sm text-on-primary/70 uppercase mb-2">Subscription</p>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary-fixed-dim" data-icon="stars" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-title-lg text-title-lg text-on-primary">Professional</span>
</div>
<span class="inline-block mt-2 font-label-sm text-label-sm bg-secondary-fixed-dim text-primary px-2 py-0.5 rounded-full w-fit">Active</span>
</div>
<!-- Active Jobs -->
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_2px_8px_rgba(13,19,33,0.04)] border border-surface-container-high flex flex-col justify-center">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-2">Active Jobs</p>
<div class="flex items-end gap-3">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary leading-none">24</span>
<span class="font-body-md text-body-md text-on-surface-variant pb-1">in progress</span>
</div>
</div>
</div>
</section>
<!-- Quick Links Grid -->
<section class="mt-4">

<div class="grid grid-cols-2 md:grid-cols-4 gap-gutter">

<span class="material-symbols-outlined text-primary" data-icon="group">group</span>
</div>
<span class="font-label-lg text-label-lg text-primary text-center">Manage Employees</span>

<button class="bg-surface-container-lowest hover:bg-surface-variant/50 transition-colors p-4 rounded-xl border border-surface-container-high shadow-sm flex flex-col items-center justify-center gap-3 group active:scale-95 duration-150">

<span class="material-symbols-outlined text-secondary-container" data-icon="card_membership">card_membership</span>

<span class="font-label-lg text-label-lg text-primary text-center">Subscription</span>

<span class="font-label-lg text-label-lg text-primary text-center">Fleet Map</span>

<!-- Home (Active) -->

</button>

<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary dark:hover:text-secondary-fixed-dim w-16 h-14 group">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-all duration-200" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</button>
</div>
</nav>
<script>
        // Simple script to handle banner dismissal
        document.addEventListener('DOMContentLoaded', () => {
            const dismissBtn = document.querySelector('[aria-label="Dismiss"]');
            if(dismissBtn) {
                dismissBtn.addEventListener('click', function() {
                    const banner = this.closest('.bg-\\[\\#FEF3C7\\]');
                    if(banner) {
                        banner.style.opacity = '0';
                        banner.style.transform = 'translateY(-10px)';
                        banner.style.transition = 'all 0.3s ease-out';
                        setTimeout(() => banner.remove(), 300);
                    }
                });
            }
        });
    </script>
</body></html>
