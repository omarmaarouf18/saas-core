<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface shadow-[0_2px_8px_0_rgba(13,19,33,0.04)] rounded-xl p-stack-lg border border-outline-variant/30 relative overflow-hidden">
<!-- Header -->
<header class="flex flex-col items-center mb-stack-lg relative z-10">
<img class="w-20 h-20 rounded-lg mb-stack-sm object-cover shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCUYxRA54E6cjcYlvRVFKb_px_s2y93S8566ONfScVXsgPYSSBE6gSdLTQArSFMfjr2mhG7alWKuev5Yy0NhzYpR9ZQ2rA3j8kpPr7IXmQajXQZ3aA0q-orw1UwKUn_AfSCkScVcZrLA68fcVoLnnl70udecxTVux2o7yX72AdzmzffZeh60l8rewzNHY-4dRPHSbf45gMZhfgjHr1Wl7ro7aoKToJTdTPJIInLWTg6XnnRsQqDMvRpww">
<h1 class="font-headline-md text-headline-md text-primary mt-unit">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-unit">Enter your email and the 6-digit OTP to create a new password.</p>
</header>
<!-- Form -->
<form class="space-y-stack-md relative z-10">
<!-- Email Field -->
<div class="flex flex-col space-y-unit">
<label class="font-label-lg text-label-lg text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface border-1.5 border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" id="email" placeholder="Enter your email" required="" type="email">
</div>
</div>
<!-- OTP Field (Bento style grid for digits) -->
<div class="flex flex-col space-y-unit pt-unit">
<label class="font-label-lg text-label-lg text-on-surface flex justify-between">
<span>6-Digit OTP</span>
<button class="text-secondary-fixed-dim font-label-lg text-label-lg hover:underline" type="button">Resend OTP</button>
</label>
<div class="grid grid-cols-6 gap-2">
<input aria-label="OTP digit 1" class="w-full text-center py-3 bg-surface border-1.5 border-outline-variant rounded-lg font-title-lg text-title-lg text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text">
<input aria-label="OTP digit 2" class="w-full text-center py-3 bg-surface border-1.5 border-outline-variant rounded-lg font-title-lg text-title-lg text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text">
<input aria-label="OTP digit 3" class="w-full text-center py-3 bg-surface border-1.5 border-outline-variant rounded-lg font-title-lg text-title-lg text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text">
<input aria-label="OTP digit 4" class="w-full text-center py-3 bg-surface border-1.5 border-outline-variant rounded-lg font-title-lg text-title-lg text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text">
<input aria-label="OTP digit 5" class="w-full text-center py-3 bg-surface border-1.5 border-outline-variant rounded-lg font-title-lg text-title-lg text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text">
<input aria-label="OTP digit 6" class="w-full text-center py-3 bg-surface border-1.5 border-outline-variant rounded-lg font-title-lg text-title-lg text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text">
</div>
</div>
<!-- New Password Field -->
<div class="flex flex-col space-y-unit pt-unit">
<label class="font-label-lg text-label-lg text-on-surface" for="new-password">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface border-1.5 border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" id="new-password" placeholder="Create new password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col space-y-unit">
<label class="font-label-lg text-label-lg text-on-surface" for="confirm-password">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface border-1.5 border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" id="confirm-password" placeholder="Confirm new password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack-sm">
<button class="w-full py-4 bg-secondary-container text-[#0D1321] rounded-lg font-title-lg text-title-lg shadow-sm hover:shadow-md hover:scale-[0.99] active:scale-[0.97] transition-all flex justify-center items-center gap-2" type="submit">
<span>Update Password</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<div class="text-center pt-unit">
<a class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center gap-1" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Back to Login
                </a>
</div>
</form>
</main>
<script>
        // Simple auto-advance for OTP inputs
        const otpInputs = document.querySelectorAll('input[maxlength="1"]');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });
    </script>
</body></html>
