<script>
        // Simple logic for custom toggle switches to ensure visual state updates
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const isDanger = this.classList.contains('toggle-checkbox-danger');
                const label = this.nextElementSibling;
                if(this.checked) {
                    if(isDanger) {
                        this.style.borderColor = '#ba1a1a';
                        label.style.backgroundColor = '#ba1a1a';
                    } else {
                        this.style.borderColor = '#FFC107';
                        label.style.backgroundColor = '#FFC107';
                    }
                } else {
                     this.style.borderColor = '#e5e2e3'; // surface-variant
                     label.style.backgroundColor = '#e5e2e3';
                }
            });
            
            // Trigger initial state
            checkbox.dispatchEvent(new Event('change'));
        });
    </script>
