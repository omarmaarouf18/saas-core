<!DOCTYPE html><html class="light" lang="en" style=""><head>

                    },
                    "borderRadius": {

                    "spacing": {

                    "fontFamily": {

<style>
        .custom-radio:checked + div {
            border-color: #0D1321;
            background-color: #f3f0f1;
        }
        .custom-radio:checked + div .indicator {
            background-color: #fdc003;
            border-color: #0D1321;
        }
    </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Header (Shared Style, simplified for transactional intent) -->
<header class="bg-surface/70 backdrop-blur-md shadow-sm fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-2">
<img alt="Quick Delivery Logo" class="w-10 h-10 rounded-lg shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCUYxRA54E6cjcYlvRVFKb_px_s2y93S8566ONfScVXsgPYSSBE6gSdLTQArSFMfjr2mhG7alWKuev5Yy0NhzYpR9ZQ2rA3j8kpPr7IXmQajXQZ3aA0q-orw1UwKUn_AfSCkScVcZrLA68fcVoLnnl70udecxTVux2o7yX72AdzmzffZeh60l8rewzNHY-4dRPHSbf45gMZhfgjHr1Wl7ro7aoKToJTdTPJIInLWTg6XnnRsQqDMvRpww">
<span class="text-headline-md font-headline-md font-black text-primary-container hidden sm:block tracking-tight">QD</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center pt-24 pb-12 px-margin-mobile w-full max-w-7xl mx-auto">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-stack-lg shadow-[0_4px_16px_0_rgba(13,19,33,0.08)] border border-outline-variant/30">
<div class="text-center mb-stack-lg">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile md:text-headline-lg md:font-headline-lg text-primary tracking-tight mb-2">Create Account</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Join Quick Delivery to manage your logistics effortlessly.</p>
</div>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Role Selection -->
<div class="space-y-stack-sm">
<label class="text-label-lg font-label-lg text-primary block">I am a...</label>
<div class="grid grid-cols-3 gap-2">
<label class="cursor-pointer relative">
<input checked="" class="custom-radio sr-only" name="role" type="radio" value="customer">
<div class="flex flex-col items-center justify-center p-3 rounded-lg border-2 border-outline-variant transition-colors duration-200 hover:border-primary/50 text-center">
<span class="material-symbols-outlined mb-1 text-on-surface-variant" data-icon="person" style="font-variation-settings: &quot;FILL&quot; 0;">person</span>
<span class="text-label-sm font-label-sm text-primary">Customer</span>
</div>
</label>

<label class="cursor-pointer relative">
<input class="custom-radio sr-only" name="role" type="radio" value="owner">
<div class="flex flex-col items-center justify-center p-3 rounded-lg border-2 border-outline-variant transition-colors duration-200 hover:border-primary/50 text-center">
<span class="material-symbols-outlined mb-1 text-on-surface-variant" data-icon="storefront" style="font-variation-settings: &quot;FILL&quot; 0;">storefront</span>
<span class="text-label-sm font-label-sm text-primary">Business</span>
</div>
</label>
</div>
</div>
<!-- Input Fields -->
<div class="space-y-stack-md pt-2">
<div>
<label class="block text-label-lg font-label-lg text-primary mb-1" for="name">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="badge">badge</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border-2 border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-outline focus:outline-none focus:ring-0 focus:border-[#0D1321] transition-colors" id="name" name="name" placeholder="John Doe" required="" type="text">
</div>
</div>
<div>
<label class="block text-label-lg font-label-lg text-primary mb-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border-2 border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-outline focus:outline-none focus:ring-0 focus:border-[#0D1321] transition-colors" id="email" name="email" placeholder="john@example.com" required="" type="email">
</div>
</div>
<div>
<label class="block text-label-lg font-label-lg text-primary mb-1" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="phone_iphone">phone_iphone</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border-2 border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-outline focus:outline-none focus:ring-0 focus:border-[#0D1321] transition-colors" id="phone" name="phone" placeholder="(555) 000-0000" required="" type="tel">
</div>
</div>
<div>
<label class="block text-label-lg font-label-lg text-primary mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2 border-2 border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-outline focus:outline-none focus:ring-0 focus:border-[#0D1321] transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<div class="pt-stack-md">
<button class="w-full flex justify-center items-center py-3 px-4 rounded-lg bg-secondary-container text-primary-container text-title-lg font-title-lg shadow-sm hover:bg-secondary-fixed-dim focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-all active:scale-95" type="submit">
                        Create Account
                    </button>
</div>
<div class="text-center pt-stack-sm">
<p class="text-body-md font-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-bold hover:underline" href="#">Log In</a>
</p>
</div>
</form>
</div>
</main>
<script>
        // Simple password toggle
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('span');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            });
        });
    </script>


</body></html>
