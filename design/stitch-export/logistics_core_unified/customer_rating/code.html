<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        .star-rating input[type="radio"] {
            display: none;
        }
        .star-rating label {
            cursor: pointer;
            transition: color 0.2s ease-in-out;
        }
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #fdc003; /* secondary-container / Amber Gold */
        }
        .star-rating input[type="radio"]:checked ~ label {
            color: #fdc003;
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background docked full-width top-0 bg-background dark:bg-background flat no shadows flex justify-between items-center px-margin-mobile py-base w-full z-50">
<button class="text-on-surface-variant hover:bg-surface-variant p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-title-md text-title-md font-bold text-primary dark:text-primary tracking-tight">Rate Delivery</h1>
<div class="w-10"></div> <!-- Spacer to center title -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-xl w-full max-w-2xl mx-auto">
<!-- Driver Info Card -->
<div class="bg-surface shadow-[0px_2px_4px_rgba(13,19,33,0.08)] rounded-xl p-md w-full mb-lg flex flex-col items-center text-center">
<div class="w-24 h-24 rounded-full overflow-hidden mb-md shadow-sm border-2 border-surface-container-high">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a delivery driver wearing a modern navy blue logistics uniform. The driver is smiling warmly, standing against a neutral light grey background that fits a clean, enterprise logistics app aesthetic. The lighting is bright and even, conveying trust and reliability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGTlNpcamU-XGgsfoccfb1otMtkvB6jjdEdrSQl5XHRrNB4LS77kyhDFb6i9v-P_6vMkliSV9cbKGiecKo4UKKe4Tczs1f3bVOsefSSGO4yjZoX13o3qQoV-vP_ym3-j-okTNSFXSC1D0XdkGh6QzLmxEIB-J18LitqX51AGzKISRpB9lVIbAGphQmKN8lo9YwjWdEEGd9uc93zDKhvrcHR_p9BePMx325QzIbAUHdOAMeamOEhimA"/>
</div>
<h2 class="font-title-md text-title-md text-on-surface mb-xs">Marcus Johnson</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Delivery ID: #QD-8472-X</p>
</div>
<!-- Rating Section -->
<div class="w-full mb-lg text-center">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile mb-md text-primary">How was your delivery?</h3>
<!-- Star Rating Component -->
<div class="star-rating flex justify-center flex-row-reverse gap-sm mb-lg">
<input id="star5" name="rating" type="radio" value="5"/>
<label class="text-outline-variant" for="star5" title="5 stars">
<span class="material-symbols-outlined text-[48px]" data-icon="star" style="font-size: 48px;">star</span>
</label>
<input id="star4" name="rating" type="radio" value="4"/>
<label class="text-outline-variant" for="star4" title="4 stars">
<span class="material-symbols-outlined text-[48px]" data-icon="star" style="font-size: 48px;">star</span>
</label>
<input id="star3" name="rating" type="radio" value="3"/>
<label class="text-outline-variant" for="star3" title="3 stars">
<span class="material-symbols-outlined text-[48px]" data-icon="star" style="font-size: 48px;">star</span>
</label>
<input id="star2" name="rating" type="radio" value="2"/>
<label class="text-outline-variant" for="star2" title="2 stars">
<span class="material-symbols-outlined text-[48px]" data-icon="star" style="font-size: 48px;">star</span>
</label>
<input id="star1" name="rating" type="radio" value="1"/>
<label class="text-outline-variant" for="star1" title="1 star">
<span class="material-symbols-outlined text-[48px]" data-icon="star" style="font-size: 48px;">star</span>
</label>
</div>
</div>
<!-- Feedback Form -->
<form class="w-full flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="comments">Additional Comments (Optional)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-md font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors resize-none placeholder:text-outline" id="comments" name="comments" placeholder="Tell us more about your experience..." rows="4"></textarea>
</div>
<!-- Submit Button -->
<button class="w-full mt-md bg-secondary-container text-on-secondary-container font-title-md text-title-md py-md rounded-xl shadow-sm hover:shadow-md hover:bg-secondary-fixed transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-sm" type="button">
                Submit Rating
                <span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</form>
</main>
<!-- Suppressed Navigations: 
         TopAppBar is simplified for a modal/transactional feel.
         BottomNavBar is suppressed because this is a focused linear task (Rating), not a top-level destination.
         NavigationDrawer is suppressed for the same reason.
         FAB is suppressed.
    -->
<script>
        // Simple script to handle visual feedback on star click (already largely handled by CSS, but added for potential programmatic needs)
        document.querySelectorAll('.star-rating input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                console.log('Rating selected:', e.target.value);
                // Here you would typically enable the submit button if it was disabled,
                // or show context-specific feedback tags based on the rating (e.g., if <= 3 stars, ask "What went wrong?")
            });
        });
    </script>
</body></html>
