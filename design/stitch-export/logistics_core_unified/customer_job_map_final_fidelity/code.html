<style>
        .dash-anim {
            stroke-dashoffset: 10;
            animation: dash 1s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }
        /* Custom scrollbar hide for cleaner UI if needed */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background antialiased selection:bg-secondary-container selection:text-on-secondary-container h-screen w-full overflow-hidden flex flex-col relative font-body-md">
<!-- Map Canvas (Primary Surface) -->
<div class="absolute inset-0 z-0 bg-cover bg-center grayscale-[20%] contrast-75 brightness-110" data-alt="A clean, modern aerial map view of a city grid featuring soft light-mode color palettes. The map style is minimalist, utilizing pale grays, whites, and subtle blues to represent streets and water, creating a highly professional and unobstructed enterprise logistics tracking background. Lighting implies clear daytime conditions." data-location="Seattle" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCk6gLGILH4q45KfY5Luz1TDQ6WR_EftS_yu9tgN9AmGr9dv8j5yuv9K7QU8Bwqd-0H8x0OCxeB2acNOMD5JyDxA7taMGAHKXiINZHEOj4Gce4KVbW8B5Fy3Jk8kN2bqMUlCHKiu7aRzSb0hY1atN9cTihOxiGJSZFDkrIlTfuvNr1GF3kxJtIqTeohFqit79rMcATKVaCt0OO7b-jLxPeNhe-Z_plQjr5TAigxlhd3rLHPr33aFxVi')">
</div>
<!-- Map Gradient Overlay (Bottom) for better contrast with the card -->
<div class="absolute inset-0 z-0 bg-gradient-to-t from-surface/60 via-transparent to-transparent pointer-events-none"></div>
<!-- Floating Top Actions (Task-Focused contextual replacement for TopAppBar) -->
<div class="absolute top-0 left-0 w-full z-20 pt-margin-mobile px-margin-mobile flex justify-between items-start pointer-events-none">
<button class="w-12 h-12 bg-surface/90 backdrop-blur-md rounded-full shadow-md flex items-center justify-center pointer-events-auto active:scale-95 transition-transform text-on-surface hover:bg-surface border border-outline-variant/30">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="bg-surface/90 backdrop-blur-md rounded-full px-4 py-2 shadow-md pointer-events-auto flex items-center gap-2 border border-outline-variant/30">
<div class="w-2 h-2 rounded-full bg-error animate-pulse"></div>
<span class="font-label-md text-label-md text-on-surface tracking-wider uppercase">Live Tracking</span>
</div>
<!-- Spacer to balance flex-between -->
<div class="w-12 h-12"></div>
</div>
<!-- Map Data Visualization Layer -->
<!-- Route Path SVG -->
<svg class="absolute inset-0 w-full h-full z-10 pointer-events-none drop-shadow-md" preserveaspectratio="none" viewbox="0 0 100 100">
<path class="dash-anim" d="M 35 55 Q 45 40 65 35" fill="none" opacity="0.6" stroke="#151b2a" stroke-dasharray="1.5 1.5" stroke-width="0.75"></path>
</svg>
<!-- Destination Marker (Deep Navy) -->
<div class="absolute top-[35%] left-[65%] z-10 flex flex-col items-center transform -translate-x-1/2 -translate-y-full">
<div class="bg-primary-container text-on-primary-container p-2 rounded-full shadow-lg border-2 border-surface flex items-center justify-center relative">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
<!-- Pin dot -->
<div class="absolute -bottom-1.5 w-1.5 h-1.5 bg-primary-container rounded-full"></div>
</div>
<div class="mt-2 bg-surface/90 backdrop-blur-sm px-2 py-1 rounded shadow-md font-label-md text-label-md text-on-surface whitespace-nowrap border border-outline-variant/20">Drop-off</div>
</div>
<!-- Active Driver Marker (Amber Gold / High Visibility) -->
<div class="absolute top-[55%] left-[35%] z-20 flex flex-col items-center transform -translate-x-1/2 -translate-y-1/2">
<div class="relative">
<!-- Pulse Effect -->
<div class="absolute inset-0 bg-secondary-container rounded-full animate-ping opacity-60 scale-150"></div>
<!-- Core Marker -->
<div class="relative bg-secondary-container text-on-secondary-container p-3 rounded-full shadow-lg border-2 border-surface flex items-center justify-center transform hover:scale-105 transition-transform cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
</div>
</div>
<!-- Map Controls -->
<div class="absolute right-4 bottom-[240px] z-20 flex flex-col gap-2 pointer-events-auto transition-all duration-300">
<div class="bg-surface/90 backdrop-blur-md rounded-xl shadow-md flex flex-col overflow-hidden border border-outline-variant/30 text-on-surface">
<button class="w-11 h-11 flex items-center justify-center hover:bg-surface-variant active:bg-surface-variant/80 transition-colors border-b border-outline-variant/30">
<span class="material-symbols-outlined">add</span>
</button>
<button class="w-11 h-11 flex items-center justify-center hover:bg-surface-variant active:bg-surface-variant/80 transition-colors">
<span class="material-symbols-outlined">remove</span>
</button>
</div>
<button class="w-11 h-11 bg-surface/90 backdrop-blur-md rounded-xl shadow-md flex items-center justify-center text-on-surface hover:bg-surface-variant active:scale-95 transition-all border border-outline-variant/30">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">my_location</span>
</button>
</div>
<!-- Semi-Transparent Bottom Job Details Card (Overlay) -->
<div class="absolute bottom-0 left-0 w-full z-30 bg-surface/95 backdrop-blur-xl rounded-t-[24px] shadow-[0px_-8px_32px_rgba(13,19,33,0.12)] border-t border-outline-variant/20 transform transition-transform duration-300 translate-y-0">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-2">
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
<div class="px-margin-mobile pb-margin-mobile pt-2 flex flex-col gap-md">
<!-- Header: Time & Status -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<span class="font-title-md text-title-md text-on-surface font-bold tracking-tight">#QD-88294A</span>
</div>
<span class="font-body-md text-body-md text-secondary-fixed-dim font-medium flex items-center gap-1.5 mt-0.5">
<span class="material-symbols-outlined text-[18px]">local_shipping</span>
                        In Transit - 12 min away
                    </span>
</div>
<!-- View Details Action -->
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md uppercase tracking-wider py-3.5 rounded-xl hover:bg-on-primary-fixed-variant active:scale-95 transition-all shadow-sm flex items-center justify-center gap-2 border border-outline-variant/20">
<span>View Details</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
