name: frontend
description: "Quick Delivery Platform Flutter Client"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.6.0
  # PUSH-FCM: pinned. 2.x needs package:web 0.5; firebase_core 4.x and
  # flutter_local_notifications 22.x need web ^1, which 3.0.3 allows.
  web_socket_channel: 3.0.3
  flutter_client_sse: ^2.0.3
  flutter_secure_storage: ^9.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  package_info_plus: ^8.3.0
  # PUSH-FCM: pinned. 4.15.0 / 16.7.0 are one FlutterFire release
  # (2026-09-14), the newest line before the 5.x / 17.x majors (Oct 2026,
  # too new); both need Flutter >=3.27 (we pin 3.44.6) and AGP 8+/9.
  # 2.x / 14.x predate AGP 9 and the Android 13 permission API.
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  # PUSH-FCM: pinned. Creates the qd_default channel (localized name) and
  # shows a push while the app is open (FCM shows nothing in the
  # foreground). 22.3.1 (2026-09-13); needs Flutter >=3.38.1 and core
  # library desugaring on Android.
  flutter_local_notifications: 22.3.1
  geolocator: ^12.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # FE-V2-CONSUME: dial, maps and links (pinned).
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  # Redesign A type family (FE-DS). Bundled, never fetched at runtime;
  # SIL OFL 1.1, license in assets/fonts/IBMPlexSansArabic-OFL.txt.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
