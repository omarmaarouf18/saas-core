name: frontend
description: "Quick Delivery Platform Flutter Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.6.0
  web_socket_channel: ^2.4.5
  flutter_client_sse: ^2.0.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^8.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  package_info_plus: ^8.3.0
  firebase_messaging: ^14.9.4
  firebase_core: ^2.32.0
  geolocator: ^12.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
