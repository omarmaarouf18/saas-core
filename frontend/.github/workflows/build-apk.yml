name: Build Release APKs (Waddify, Waddify Console, Waddify Employees)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # PINNED to the version saas-core CI tests and renders goldens with
          # (.github/workflows/ci.yml); bump both together.
          flutter-version: '3.44.6'

      - name: Install Dependencies
        run: flutter pub get

      # PUSH-FCM: the Firebase client config is never committed. With the
      # repository secret GOOGLE_SERVICES_JSON_B64 (base64 of
      # android/app/google-services.json) the build has push; without it
      # the build still succeeds, with push disabled (frontend/docs/PUSH.md).
      - name: Firebase config for push
        id: firebase
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
            # SPLIT-APPS (ADR-0030): the file must list all three application
            # IDs; an old single-app file would build APKs whose push never works.
            if jq -e '[.client[].client_info.android_client_info.package_name] as $p | ["app.waddify","app.waddify.console","app.waddify.employees"] | all(. as $id | $p | index($id))' android/app/google-services.json >/dev/null; then
              echo "push=enabled" >> "$GITHUB_OUTPUT"
              echo "Push: enabled (google-services.json lists all three Waddify application IDs)"
            else
              rm -f android/app/google-services.json
              echo "push=disabled" >> "$GITHUB_OUTPUT"
              echo "::warning::GOOGLE_SERVICES_JSON_B64 does not list app.waddify, app.waddify.console and app.waddify.employees: push disabled in this build"
              echo "> ⚠️ **push disabled in this build**: the Firebase config does not list all three Waddify application IDs (ADR-0030). Add the three Android apps in Firebase and update GOOGLE_SERVICES_JSON_B64." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            rm -f android/app/google-services.json
            echo "push=disabled" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_SERVICES_JSON_B64 is not set: push disabled in this build"
            echo "> ⚠️ **push disabled in this build**: the GOOGLE_SERVICES_JSON_B64 secret is not set, so the APK has no Firebase config (frontend/docs/PUSH.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Determine Version & Short SHA
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          # pubspec `version: MAJOR.MINOR.PATCH+build`: the semver part is the
          # release version (ADR-0018); the build number is this run's number.
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          BUILD_NUMBER=${{ github.run_number }}
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "full_version=${VERSION}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      # SPLIT-APPS (ADR-0030): one codebase, three Android flavors. Every build
      # needs --flavor plus the matching APP_CLIENT define. Asset names:
      #   waddify.apk / waddify-console.apk / waddify-employees.apk  (universal)
      #   <name>-<abi>.apk                                            (per ABI)
      #   app-release.apk = copy of waddify.apk (legacy channel: the api-gateway
      #   default download_url and the website default; see scripts/test_apk_channel.sh)
      - name: Build Release APKs (3 apps, universal + one per ABI)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.logiclinkeg.tech/api/v1' }}
        run: |
          set -euo pipefail
          OUT=build/app/outputs/flutter-apk
          mkdir -p dist
          declare -A NAME=([customer]=waddify [console]=waddify-console [employees]=waddify-employees)
          for CLIENT in customer console employees; do
            DEFINES=(--flavor "$CLIENT"
              --build-number=${{ github.run_number }}
              --dart-define=APP_CLIENT="$CLIENT"
              --dart-define=API_BASE_URL="${API_BASE_URL}"
              --dart-define=APP_VERSION="${{ steps.vars.outputs.full_version }}")
            flutter build apk --release "${DEFINES[@]}"
            cp "$OUT/app-$CLIENT-release.apk" "dist/${NAME[$CLIENT]}.apk"
            flutter build apk --release --split-per-abi "${DEFINES[@]}"
            for ABI in armeabi-v7a arm64-v8a x86_64; do
              cp "$OUT/app-$ABI-$CLIENT-release.apk" "dist/${NAME[$CLIENT]}-$ABI.apk"
            done
          done
          cp dist/waddify.apk dist/app-release.apk
          ls -l dist

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.vars.outputs.short_sha }}
          path: dist/*.apk

      - name: Create GitHub Release with APKs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-release-${{ steps.vars.outputs.short_sha }}"
          APKS=$(ls dist/*.apk)
          gh release create "$TAG" $APKS \
            --repo omarmaarouf18/quick-delivery-mobile \
            --title "App Release ${{ steps.vars.outputs.full_version }} (${{ steps.vars.outputs.short_sha }})" \
            --notes "Automated release built from version ${{ steps.vars.outputs.full_version }} (commit ${{ steps.vars.outputs.short_sha }}). Three apps: waddify.apk (customers), waddify-console.apk (business owners), waddify-employees.apk (staff); each also per ABI (most phones need arm64-v8a). app-release.apk is a copy of waddify.apk for the legacy download link." \
            || gh release upload "$TAG" $APKS \
               --repo omarmaarouf18/quick-delivery-mobile \
               --clobber
          BASE="https://github.com/omarmaarouf18/quick-delivery-mobile/releases/download/${TAG}"
          # ONE CHANNEL: the website's default download (apk_url) is the
          # universal app-release.apk, the same file the api-gateway
          # download_url (releases/latest/download/app-release.apk) hands out
          # at the forced-update gate. Split APKs carry an ABI version-code
          # offset (arm64-v8a = 2000 + n, universal = n), so a phone that got
          # a split from the website could never install the gate's universal
          # update ("App not installed"). Splits stay in apk_urls for manual
          # installs only. Guarded by "Verify app-release.json channel" below
          # and scripts/test_apk_channel.sh in saas-core.
          echo "apk_url=${BASE}/app-release.apk" >> "$GITHUB_OUTPUT"
          echo "apk_url_armeabi_v7a=${BASE}/app-armeabi-v7a-release.apk" >> "$GITHUB_OUTPUT"
          echo "apk_url_arm64_v8a=${BASE}/app-arm64-v8a-release.apk" >> "$GITHUB_OUTPUT"
          echo "apk_url_x86_64=${BASE}/app-x86_64-release.apk" >> "$GITHUB_OUTPUT"
          echo "apk_url_universal=${BASE}/app-release.apk" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          SIZE_MB=$(du -m dist/waddify.apk | cut -f1)
          echo "size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: omarmaarouf18
          repositories: logiclink

      - name: Publish release info to logiclinkeg.tech website
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "Error: APP_TOKEN is missing or empty."
            exit 1
          fi
          git clone "https://x-access-token:${APP_TOKEN}@github.com/omarmaarouf18/logiclink.git" /tmp/logiclink
          cd /tmp/logiclink
          cat > app-release.json <<EOF
          {
            "version": "${{ steps.vars.outputs.version }}",
            "full_version": "${{ steps.vars.outputs.full_version }}",
            "build_number": "${{ steps.vars.outputs.build_number }}",
            "build_sha": "${{ steps.vars.outputs.short_sha }}",
            "apk_url": "${{ steps.release.outputs.apk_url }}",
            "apk_urls": {
              "armeabi-v7a": "${{ steps.release.outputs.apk_url_armeabi_v7a }}",
              "arm64-v8a": "${{ steps.release.outputs.apk_url_arm64_v8a }}",
              "x86_64": "${{ steps.release.outputs.apk_url_x86_64 }}",
              "universal": "${{ steps.release.outputs.apk_url_universal }}"
            },
            "apps": {
              "customer": {
                "name": "Waddify",
                "application_id": "app.waddify",
                "apk_url": "${{ steps.release.outputs.base }}/waddify.apk",
                "apk_urls": {
                  "armeabi-v7a": "${{ steps.release.outputs.base }}/waddify-armeabi-v7a.apk",
                  "arm64-v8a": "${{ steps.release.outputs.base }}/waddify-arm64-v8a.apk",
                  "x86_64": "${{ steps.release.outputs.base }}/waddify-x86_64.apk"
                }
              },
              "console": {
                "name": "Waddify Console",
                "application_id": "app.waddify.console",
                "apk_url": "${{ steps.release.outputs.base }}/waddify-console.apk",
                "apk_urls": {
                  "armeabi-v7a": "${{ steps.release.outputs.base }}/waddify-console-armeabi-v7a.apk",
                  "arm64-v8a": "${{ steps.release.outputs.base }}/waddify-console-arm64-v8a.apk",
                  "x86_64": "${{ steps.release.outputs.base }}/waddify-console-x86_64.apk"
                }
              },
              "employees": {
                "name": "Waddify Employees",
                "application_id": "app.waddify.employees",
                "apk_url": "${{ steps.release.outputs.base }}/waddify-employees.apk",
                "apk_urls": {
                  "armeabi-v7a": "${{ steps.release.outputs.base }}/waddify-employees-armeabi-v7a.apk",
                  "arm64-v8a": "${{ steps.release.outputs.base }}/waddify-employees-arm64-v8a.apk",
                  "x86_64": "${{ steps.release.outputs.base }}/waddify-employees-x86_64.apk"
                }
              }
            },
            "build_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "size_mb": "${{ steps.release.outputs.size_mb }}"
          }
          EOF
          # Verify app-release.json channel: refuse to publish if the default
          # download is not the universal app-release.apk the update gate uses.
          jq -e '(.apk_url | endswith("/app-release.apk")) and (.apk_url == .apk_urls.universal)' app-release.json >/dev/null || {
            echo "Error: app-release.json apk_url must be the universal app-release.apk (same file as apk_urls.universal and the api-gateway download_url):"
            cat app-release.json
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-release.json
          git commit -m "chore: update latest APK release info to ${{ steps.vars.outputs.short_sha }}" || echo "No changes to commit, skipping."
          git push origin main

      - name: Add Job Summary
        run: |
          echo "### 📱 Android APK Build Complete (Waddify, Waddify Console, Waddify Employees)" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ steps.vars.outputs.full_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: \`app-release-${{ steps.vars.outputs.short_sha }}\` (waddify, waddify-console, waddify-employees: universal + one per ABI; app-release.apk = waddify.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Base URL**: \`${{ vars.API_BASE_URL || 'https://api.logiclinkeg.tech/api/v1' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Push**: ${{ steps.firebase.outputs.push == 'enabled' && 'enabled' || 'push disabled in this build (GOOGLE_SERVICES_JSON_B64 not set)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APKs from the **Artifacts** section at the bottom of this workflow run page, or from the GitHub release." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### For the website team" >> $GITHUB_STEP_SUMMARY
          echo "- The default download (\`apk_url\` in app-release.json) and the in-app update are always the **universal** \`app-release.apk\`: ${{ steps.release.outputs.apk_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Split APKs (\`apk_urls\` per ABI) are for manual install only. They have higher Android version codes (arm64-v8a = 2000 + build number), so a phone that installed a split must keep installing splits of the same ABI; it cannot install the universal update. Never make a split the default button." >> $GITHUB_STEP_SUMMARY
