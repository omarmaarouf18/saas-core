name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.logiclinkeg.tech/api/v1' }}
        run: |
          flutter build apk --release --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Determine Short SHA
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.vars.outputs.short_sha }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-release-${{ steps.vars.outputs.short_sha }}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --repo omarmaarouf18/quick-delivery-mobile \
            --title "App Release ${{ steps.vars.outputs.short_sha }}" \
            --notes "Automated release built from commit ${{ steps.vars.outputs.short_sha }}"
          echo "apk_url=https://github.com/omarmaarouf18/quick-delivery-mobile/releases/download/${TAG}/app-release.apk" >> "$GITHUB_OUTPUT"
          SIZE_MB=$(du -m build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: omarmaarouf18
          repositories: logiclinc

      - name: Publish release info to logiclinkeg.tech website
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "Error: APP_TOKEN is missing or empty."
            exit 1
          fi
          git clone "https://x-access-token:${APP_TOKEN}@github.com/omarmaarouf18/logiclinc.git" /tmp/logiclinc
          cd /tmp/logiclinc
          cat > app-release.json <<EOF
          {
            "version": "${{ steps.vars.outputs.short_sha }}",
            "apk_url": "${{ steps.release.outputs.apk_url }}",
            "build_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "size_mb": "${{ steps.release.outputs.size_mb }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-release.json
          git commit -m "chore: update latest APK release info to ${{ steps.vars.outputs.short_sha }}" || echo "No changes to commit, skipping."
          git push origin main

      - name: Add Job Summary
        run: |
          echo "### 📱 Android APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: \`app-release-${{ steps.vars.outputs.short_sha }}.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Base URL**: \`${{ vars.API_BASE_URL || 'https://api.logiclinkeg.tech/api/v1' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK artifact directly from the **Artifacts** section at the bottom of this workflow run page." >> $GITHUB_STEP_SUMMARY
