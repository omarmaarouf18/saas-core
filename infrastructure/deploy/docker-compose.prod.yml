# =============================================================================
# SaaS Platform — Production Deployment Docker Compose Orchestration
# =============================================================================
# THIS IS A REFERENCE COPY maintained in saas-core. The update-deployment-repo
# job in build-and-publish.yml copies this file to saas-core-deploy with
# IMAGE_TAG substituted for the actual commit SHA.
#
# Usage (on production VM, via deploy.yml):
#   docker compose --env-file .env up -d
#   docker compose --env-file .env down
# =============================================================================

# Log rotation for every container (OPS-HARDEN). The VM has no daemon.json
# limits, and the unbounded json-file log of mongo alone reached 1.6 GB.
# 10 MB x 3 files caps each container at 30 MB of logs on disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Memory (OPS-HARDEN): the VM has 891 MB of RAM. mem_limit values add up to
# 728 MiB, which leaves about 160 MiB for the OS, dockerd and the Actions
# runner. Each limit is several times the RSS measured in production on
# 2026-10-16; the per-service reasoning is in docs/worklog/OPS-HARDEN.md.
# Go services also get GOMEMLIMIT (about 80 % of mem_limit) so the garbage
# collector works harder before the kernel OOM-kills the container.

services:
  # ---------------------------------------------------------------------------
  # Data Stores
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: saas-mongo
    logging: *default-logging
    mem_limit: 400m
    mem_reservation: 192m
    restart: unless-stopped
    # --quiet drops the per-connection "Connection accepted/ended" lines (the
    # 1.6 GB log was mostly connection noise; locally, one healthcheck run
    # logged 20 lines without --quiet and 12 with it). Warnings and errors are
    # still logged. Command output and replication-activity lines are also
    # suppressed, which is acceptable for this single-node setup.
    # --wiredTigerCacheSizeGB 0.25 (the minimum): pins the cache instead of
    # relying on mongod detecting the container limit (otherwise it sizes the
    # cache from the RAM it sees). 400m = 256 MiB cache + mongod
    # overhead + the mongosh healthcheck process, which runs in this cgroup.
    command: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      # 30s, not 10s: each check opens several mongosh connections and still
      # logs about 12 lines under --quiet (client metadata, authentication).
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - saas-net

  redis:
    image: redis:7-alpine
    container_name: saas-redis
    logging: *default-logging
    mem_limit: 48m
    mem_reservation: 16m
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # maxmemory 32mb + noeviction: every key here has a TTL, including the
    # session-revocation keys (jwt:invalidated_before:*, jwt:denylist:*), so any
    # volatile-* or allkeys-* policy could evict a revocation and re-validate a
    # revoked token. With noeviction, a full Redis rejects writes instead; the
    # rate limiters and revocation then fail closed (429/503). Measured RSS is
    # 3.4 MB, so 32mb is roughly 10x headroom.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - saas-net

  # ---------------------------------------------------------------------------
  # Production Microservices (Images from GHCR)
  # ---------------------------------------------------------------------------
  api-gateway:
    image: ghcr.io/omarmaarouf18/saas-core-api-gateway:IMAGE_TAG
    container_name: saas-api-gateway
    logging: *default-logging
    mem_limit: 32m
    restart: unless-stopped
    # Not published on the host (OPS-HARDEN): the only public entry point is
    # Caddy, which reaches the gateway over saas-net. A host port let clients
    # bypass Caddy and forge X-Forwarded-For (the gateway trusts its first
    # entry). deploy.yml health checks run inside the container, so nothing on
    # the host needs this port.
    expose:
      - "${API_GATEWAY_PORT}"
    volumes:
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/api-gateway.crt:/app/certs/api-gateway.crt:ro
      - ./certs/api-gateway.key:/app/certs/api-gateway.key:ro
      - ./certs/api-gateway-external.crt:/app/certs/api-gateway-external.crt:ro
      - ./certs/api-gateway-external.key:/app/certs/api-gateway-external.key:ro
    environment:
      GOMEMLIMIT: 25MiB
      PORT: ${API_GATEWAY_PORT}
      MONGO_URI: ${MONGO_URI}
      REDIS_URI: ${REDIS_URI}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      TLS_CERT_PATH: /app/certs/api-gateway.crt
      TLS_KEY_PATH: /app/certs/api-gateway.key
      TLS_CA_PATH: /app/certs/ca.crt
      EXTERNAL_TLS_CERT_PATH: /app/certs/api-gateway-external.crt
      EXTERNAL_TLS_KEY_PATH: /app/certs/api-gateway-external.key
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-net

  chat-service:
    image: ghcr.io/omarmaarouf18/saas-core-chat-service:IMAGE_TAG
    container_name: saas-chat-service
    logging: *default-logging
    mem_limit: 56m
    restart: unless-stopped
    expose:
      - "${CHAT_SERVICE_PORT}"
    volumes:
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/chat-service.crt:/app/certs/chat-service.crt:ro
      - ./certs/chat-service.key:/app/certs/chat-service.key:ro
      - attachments_data:/app/data/attachments
    environment:
      GOMEMLIMIT: 45MiB
      PORT: ${CHAT_SERVICE_PORT}
      MONGO_URI: ${MONGO_URI}
      CHAT_MONGO_DATABASE: ${CHAT_MONGO_DATABASE:-chat_db}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      REDIS_URI: ${REDIS_URI}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      ATTACHMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      ATTACHMENT_SIGNING_SECRET: ${DOCUMENT_SIGNING_SECRET}
      STORAGE_BASE_DIR: /app/data/attachments
      AWS_REGION: ${AWS_REGION}
      CLOUDWATCH_LOG_GROUP: ${CLOUDWATCH_LOG_GROUP}
      TLS_CERT_PATH: /app/certs/chat-service.crt
      TLS_KEY_PATH: /app/certs/chat-service.key
      TLS_CA_PATH: /app/certs/ca.crt
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-net

  auth-service:
    image: ghcr.io/omarmaarouf18/saas-core-auth-service:IMAGE_TAG
    container_name: saas-auth-service
    logging: *default-logging
    mem_limit: 56m
    restart: unless-stopped
    expose:
      - "${AUTH_SERVICE_PORT}"
    volumes:
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/auth-service.crt:/app/certs/auth-service.crt:ro
      - ./certs/auth-service.key:/app/certs/auth-service.key:ro
      - documents_data:/app/data/documents
    environment:
      GOMEMLIMIT: 45MiB
      PORT: ${AUTH_SERVICE_PORT}
      MONGO_URI: ${MONGO_URI}
      AUTH_MONGO_DATABASE: ${AUTH_MONGO_DATABASE:-auth_db}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      REDIS_URI: ${REDIS_URI}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET: ${JWT_SECRET}
      DOCUMENT_SIGNING_SECRET: ${DOCUMENT_SIGNING_SECRET}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      STORAGE_BASE_DIR: /app/data/documents
      OTP_AES_KEY: ${OTP_AES_KEY}
      AWS_REGION: ${AWS_REGION}
      CLOUDWATCH_LOG_GROUP: ${CLOUDWATCH_LOG_GROUP}
      TLS_CERT_PATH: /app/certs/auth-service.crt
      TLS_KEY_PATH: /app/certs/auth-service.key
      TLS_CA_PATH: /app/certs/ca.crt
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-net

  user-service:
    image: ghcr.io/omarmaarouf18/saas-core-user-service:IMAGE_TAG
    container_name: saas-user-service
    logging: *default-logging
    mem_limit: 48m
    restart: unless-stopped
    expose:
      - "${USER_SERVICE_PORT}"
    volumes:
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/user-service.crt:/app/certs/user-service.crt:ro
      - ./certs/user-service.key:/app/certs/user-service.key:ro
      # Service photos (encrypted at rest). The image pre-creates this dir
      # owned by appuser, so a fresh named volume inherits that ownership.
      - service_photos_data:/app/data/service_photos
    environment:
      GOMEMLIMIT: 38MiB
      PORT: ${USER_SERVICE_PORT}
      MONGO_URI: ${MONGO_URI}
      USER_MONGO_DATABASE: ${USER_MONGO_DATABASE:-user_db}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      REDIS_URI: ${REDIS_URI}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # Same key as the auth-service documents and chat attachments; without
      # a valid 64-hex key user-service refuses to start in production.
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      STORAGE_BASE_DIR: /app/data/service_photos
      AWS_REGION: ${AWS_REGION}
      CLOUDWATCH_LOG_GROUP: ${CLOUDWATCH_LOG_GROUP}
      DIGITAL_PAYMENTS_ENABLED: ${DIGITAL_PAYMENTS_ENABLED:-false}
      TLS_CERT_PATH: /app/certs/user-service.crt
      TLS_KEY_PATH: /app/certs/user-service.key
      TLS_CA_PATH: /app/certs/ca.crt
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-net

  notification-service:
    image: ghcr.io/omarmaarouf18/saas-core-notification-service:IMAGE_TAG
    container_name: saas-notification-service
    logging: *default-logging
    mem_limit: 32m
    restart: unless-stopped
    expose:
      - "${NOTIFICATION_SERVICE_PORT}"
    volumes:
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/notification-service.crt:/app/certs/notification-service.crt:ro
      - ./certs/notification-service.key:/app/certs/notification-service.key:ro
    environment:
      GOMEMLIMIT: 25MiB
      PORT: ${NOTIFICATION_SERVICE_PORT}
      MONGO_URI: ${MONGO_URI}
      NOTIFICATION_MONGO_DATABASE: ${NOTIFICATION_MONGO_DATABASE:-notification_db}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      REDIS_URI: ${REDIS_URI}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      TLS_CERT_PATH: /app/certs/notification-service.crt
      TLS_KEY_PATH: /app/certs/notification-service.key
      TLS_CA_PATH: /app/certs/ca.crt
      # Push (FCM): base64 of the Firebase service-account key file; empty
      # = push disabled (logged as "push disabled: ..."), never a startup
      # failure. See docs/DEPLOYMENT.md "FCM push credentials".
      FCM_SERVICE_ACCOUNT_JSON_B64: ${FCM_SERVICE_ACCOUNT_JSON_B64:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-net

  # ---------------------------------------------------------------------------
  # KYC/KYB/KYE Reviewer Console (saas-core ADR-0021, separate repo)
  # ---------------------------------------------------------------------------
  # Internal-network component that holds the internal token and proxies
  # reviewer actions to auth-service. NOT publicly bound: the `caddy` service
  # below terminates kyc.<domain> and reaches it on saas-net.
  # Image is built by omarmaarouf18/kyc-reviewer-console's own CI; pin via
  # KYC_CONSOLE_IMAGE_TAG in .env (no latest fallback, deploy preflight fails if unset).
  kyc-reviewer-console:
    image: ghcr.io/omarmaarouf18/kyc-reviewer-console:${KYC_CONSOLE_IMAGE_TAG:?KYC_CONSOLE_IMAGE_TAG is required}
    container_name: saas-kyc-reviewer-console
    logging: *default-logging
    mem_limit: 16m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/reviewer-console.crt:/app/certs/reviewer-console.crt:ro
      - ./certs/reviewer-console.key:/app/certs/reviewer-console.key:ro
    environment:
      PORT: 8090
      AUTH_SERVICE_URL: https://auth-service:${AUTH_SERVICE_PORT}
      USER_SERVICE_URL: https://user-service:${USER_SERVICE_PORT}
      CHAT_SERVICE_URL: https://chat-service:${CHAT_SERVICE_PORT}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      APP_ENV: ${APP_ENV}
      TLS_CERT_PATH: /app/certs/reviewer-console.crt
      TLS_KEY_PATH: /app/certs/reviewer-console.key
      TLS_CA_PATH: /app/certs/ca.crt
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-net

  # ---------------------------------------------------------------------------
  # Public TLS edge (ADR-0011): the only service published on 80/443
  # ---------------------------------------------------------------------------
  # Replaces the hand-started saas-caddy container (same name, same network,
  # same certificate volume); cutover steps in docs/runbooks/OPS-HARDEN-cutover.md.
  # Image pinned to an exact tag: 2.11.4-alpine was pushed to Docker Hub on
  # 2026-09-23, more than 14 days before it was pinned (2026-10-16); the
  # newer 2.11.6/2.11.7 builds were younger than 14 days.
  caddy:
    image: caddy:2.11.4-alpine
    container_name: saas-caddy
    logging: *default-logging
    mem_limit: 40m
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway
      - kyc-reviewer-console
    environment:
      GOMEMLIMIT: 32MiB
      KYC_CONSOLE_BASIC_AUTH_USER: ${KYC_CONSOLE_BASIC_AUTH_USER:-}
      KYC_CONSOLE_BASIC_AUTH_HASH: ${KYC_CONSOLE_BASIC_AUTH_HASH:-}
    networks:
      - saas-net

# ---------------------------------------------------------------------------
# Persistent Volumes
# ---------------------------------------------------------------------------
volumes:
  mongo_data:
    driver: local
    name: saas_platform_mongo_data
  redis_data:
    driver: local
    name: saas_platform_redis_data
  documents_data:
    driver: local
    name: saas_platform_documents_data
  attachments_data:
    driver: local
    name: saas_platform_attachments_data
  service_photos_data:
    driver: local
    name: saas_platform_service_photos_data
  # Let's Encrypt account and certificates of the hand-started Caddy. External
  # so compose never creates, renames or deletes it: the certs must survive.
  caddy_data:
    external: true
    name: caddy_data
  caddy_config:
    driver: local
    name: saas_platform_caddy_config

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
networks:
  saas-net:
    driver: bridge
