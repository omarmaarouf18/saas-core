<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حساب جديد</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D1321}a:hover{color:#0D1321}
button,input{font-family:inherit}
</style>
</helmet>
<div lang="ar" dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #0D1321; font-family: 'IBM Plex Sans Arabic', sans-serif; display: flex; flex-direction: column; padding: 20px 24px 28px; overflow: hidden">

<header style="display: flex; align-items: center; gap: 8px; margin: 0 -12px">
<button aria-label="رجوع" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D1321" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</header>

<h1 style="margin: 12px 0 20px; font-size: 26px; font-weight: 700">حساب جديد</h1>

<form style="display: flex; flex-direction: column; gap: 14px">
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 500; padding: 0; margin-bottom: 8px">أنت مين؟</legend>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<label style="border: 2px solid #0D1321; background: #FFF8E1; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><input type="radio" name="role" checked style="accent-color: #0D1321; width: 18px; height: 18px; margin: 0">عميل</span>
<span style="font-size: 12px; color: #4B5563">عايز أبعت طلبات</span>
</label>
<label style="border: 1px solid #D1D5DB; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><input type="radio" name="role" style="accent-color: #0D1321; width: 18px; height: 18px; margin: 0">صاحب شغل</span>
<span style="font-size: 12px; color: #4B5563">عندي شركة ومندوبين</span>
</label>
</div>
<span style="font-size: 12px; color: #4B5563">المندوبين بياخدوا حساباتهم من صاحب الشغل.</span>
</fieldset>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">الاسم
<input type="text" style="height: 50px; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-size: 15px; color: #0D1321">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">الإيميل
<input type="email" dir="ltr" style="height: 50px; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-size: 15px; color: #0D1321; text-align: right">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">كلمة السر
<input type="password" style="height: 50px; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-size: 15px; color: #0D1321">
<span style="font-size: 12px; color: #4B5563; font-weight: 400">8 حروف على الأقل، ومتكونش سهلة زي 12345678</span>
</label>

<button type="submit" style="margin-top: 6px; height: 54px; border-radius: 14px; border: 0; background: #FFC107; color: #0D1321; font-size: 16px; font-weight: 700; cursor: pointer">اعمل الحساب</button>
</form>

<p style="margin: auto 0 0; text-align: center; font-size: 14px; color: #4B5563">عندك حساب؟ <a href="#" style="font-weight: 600">ادخل</a></p>
</div>
</x-dc>

}
}
</script>
</body>
</html>
