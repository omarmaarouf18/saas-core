name: CI Gate

on:
  push:
    branches: [ main, logic-exploitation ]
  pull_request:
    branches: [ main, logic-exploitation ]

jobs:
  lint-formatting:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, chat-service, notification-service, user-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: go mod download

      - name: Build Service
        working-directory: services/${{ matrix.service }}
        run: go build ./...

      - name: Vet Service
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

      - name: Test Service
        working-directory: services/${{ matrix.service }}
        env:
          MONGO_URI: mongodb://localhost:27017
          REDIS_URI: redis://localhost:6379
          MONGO_INITDB_DATABASE: saas_platform_test
        run: go test ./...
