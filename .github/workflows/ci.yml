name: CI Gate

on:
  push:
    branches: [ main, logic-exploitation ]
  pull_request:
    branches: [ main, logic-exploitation ]

jobs:
  lint-formatting:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        service:
          - { path: services/api-gateway, name: api-gateway }
          - { path: services/auth-service, name: auth-service }
          - { path: services/chat-service, name: chat-service }
          - { path: services/notification-service, name: notification-service }
          - { path: services/user-service, name: user-service }
          - { path: shared/infra, name: shared-infra }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        working-directory: ${{ matrix.service.path }}
        run: go mod download

      - name: Build Service
        working-directory: ${{ matrix.service.path }}
        run: go build ./...

      - name: Vet Service
        working-directory: ${{ matrix.service.path }}
        run: go vet ./...

      - name: Test Service
        working-directory: ${{ matrix.service.path }}
        env:
          MONGO_URI: mongodb://localhost:27017
          REDIS_URI: redis://localhost:6379
          MONGO_INITDB_DATABASE: saas_platform_test
        run: go test ./...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: ${{ matrix.service.path }}

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
        working-directory: ${{ matrix.service.path }}

  flutter-test:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Verify Formatting
        working-directory: frontend
        run: flutter format --set-exit-if-changed lib/

      - name: Flutter Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Flutter Test
        working-directory: frontend
        run: flutter test

