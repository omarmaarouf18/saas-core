name: Release Gate E2E

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-release-gate:
    name: Staging E2E Critical User Journeys (CUJ-A & CUJ-B)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Provision Staging Environment
        run: |
          chmod +x scripts/staging_up.sh scripts/staging_down.sh
          bash scripts/staging_up.sh

      - name: Execute End-to-End CUJ Test Suite
        run: |
          go test -v -count=1 ./tests/e2e/...

      - name: Tear Down Staging Environment
        if: always()
        run: |
          bash scripts/staging_down.sh
