name: Build and Publish Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build & Publish GHCR Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - chat-service
          - notification-service
          - user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/saas-core-${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-deployment-repo:
    name: Update Deployment Repository Image Tags
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: omarmaarouf18
          repositories: saas-core-deploy

      - name: Checkout Deployment Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/saas-core-deploy
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - name: Update Service Image Tags in docker-compose.yml
        run: |
          sed -i "s|image: ghcr.io/${{ github.repository_owner }}/saas-core-\([^:]*\):.*|image: ghcr.io/${{ github.repository_owner }}/saas-core-\1:${{ github.sha }}|g" docker-compose.yml

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy: update production image tags to commit ${{ github.sha }}"
            git push origin main
          fi
