# .gitleaks.toml — secret-scan rules (WF-03).
#
# Read by scripts/gitleaks-scan.sh (local gate: `make check`, pre-push) and by
# the secret-scan job in .github/workflows/ci.yml. gitleaks is pinned in
# tools/versions.env (GITLEAKS_VERSION) and installed by scripts/install-tools.sh.
#
# Only commit ranges / uncommitted changes are scanned, never all history:
# old history still holds staging credentials removed long ago, and the owner
# verified they are not used in production (docs/CI_CD_AND_HOOKS.md).

title = "saas-core gitleaks config"

# Keep every default rule.
[extend]
useDefault = true

[[allowlists]]
description = "Placeholders that are never real secrets (CHANGE_ME_*, e.g. scripts/compose-validate.sh)"
regexes = ['''CHANGE_ME[A-Za-z0-9_]*''']

[[allowlists]]
description = """Key-shaped literals in tests (test JWT secrets, fake tokens, passwords).
Only the noisy generic rule is relaxed: specific rules (AWS, GitHub, Stripe,
private keys, ...) still fire in test files."""
targetRules = ["generic-api-key"]
paths = [
  '''_test\.go$''',
  '''_test\.dart$''',
  '''(^|/)testdata/''',
]

[[allowlists]]
description = "Build output (ignored by git; only reachable through a dir scan)"
paths = ['''(^|/)frontend/build/''']
